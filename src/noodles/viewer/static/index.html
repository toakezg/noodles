<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noodles Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* --- Theme colours (light default, dark via [data-theme="dark"]) --- */
  :root {
    color-scheme: light;
    --bg: #fff;
    --fg: #333;
    --bar-bg: #f5f5f5;
    --border: #ddd;
    --btn-border: #ccc;
    --btn-fg: #555;
    --btn-hover: #e0e0e0;
    --link: #1a73e8;
    --link-hover-bg: #e8f0fe;
    --muted: #999;
    --error: #f66;
    --tt-bg: #fff;
    --tt-strong: #222;
    --tt-desc: #555;
    --tt-file: #888;
    --tt-sep: #eee;
    --tt-row: #666;
    --tt-update: #f57f17;
    --shadow: rgba(0, 0, 0, 0.12);
    --legend-bg: rgba(255, 255, 255, 0.92);
    --legend-fg: #555;
    --legend-sep: #e0e0e0;
    --legend-hint: #888;
    --badge-start-bg: #e0f2f1;    --badge-start-fg: #00695c;
    --badge-process-bg: #d6e4f0;  --badge-process-fg: #1a4a7a;
    --badge-end-bg: #f8d7da;      --badge-end-fg: #721c24;
    --badge-updated-bg: #fff9c4;  --badge-updated-fg: #f57f17;
    --badge-new-bg: #c8e6c9;      --badge-new-fg: #2e7d32;
    --lg-process-fill: #e3f2fd;
    --lg-end-fill: #fce4ec;
    --lg-updated-fill: #fff9c4;
    --lg-new-fill: #c8e6c9;
    --code-bg: #fafafa;
    --code-fg: #24292e;
    --code-ln: #a0a0a0;
    --code-def-bg: #fff3c4;
    --code-call-bg: #e8f0fe;
  }
  :root[data-theme="dark"] {
    --code-bg: #18191b;
    --code-fg: #d4d4d4;
    --code-ln: #6b6b6b;
    --code-def-bg: #3d3a1f;
    --code-call-bg: #1f2d40;
    color-scheme: dark;
    --bg: #1e1f22;
    --fg: #d4d4d4;
    --bar-bg: #2b2d30;
    --border: #3c3f44;
    --btn-border: #555;
    --btn-fg: #c8c8c8;
    --btn-hover: #3a3d41;
    --link: #8ab4f8;
    --link-hover-bg: #2d3748;
    --muted: #8a8a8a;
    --error: #ff8a80;
    --tt-bg: #2b2d30;
    --tt-strong: #eee;
    --tt-desc: #bbb;
    --tt-file: #999;
    --tt-sep: #3c3f44;
    --tt-row: #aaa;
    --tt-update: #ffb74d;
    --shadow: rgba(0, 0, 0, 0.5);
    --legend-bg: rgba(43, 45, 48, 0.92);
    --legend-fg: #c8c8c8;
    --legend-sep: #3c3f44;
    --legend-hint: #8a8a8a;
    --badge-start-bg: #12312e;    --badge-start-fg: #80cbc4;
    --badge-process-bg: #1c2f45;  --badge-process-fg: #90caf9;
    --badge-end-bg: #3d1d21;      --badge-end-fg: #ef9a9a;
    --badge-updated-bg: #3d340c;  --badge-updated-fg: #ffe082;
    --badge-new-bg: #1b3320;      --badge-new-fg: #a5d6a7;
    --lg-process-fill: #1c2f45;
    --lg-end-fill: #3d1d21;
    --lg-updated-fill: #3d340c;
    --lg-new-fill: #1b3320;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Breadcrumb bar --- */
  #breadcrumb-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 44px;
  }

  #back-btn, #theme-btn, .orient-btn {
    background: none;
    border: 1px solid var(--btn-border);
    color: var(--btn-fg);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  #back-btn:hover, #theme-btn:hover, .orient-btn:hover { background: var(--btn-hover); }
  #back-btn:disabled { opacity: 0.3; cursor: default; }
  #back-btn:disabled:hover { background: none; }
  #orient-tools { margin-left: auto; display: flex; gap: 4px; }
  .orient-btn { padding: 4px 9px; }
  .orient-btn.active { border-color: var(--link); color: var(--link); }

  #breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    font-size: 14px;
  }

  .crumb {
    color: var(--link);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .crumb:hover { background: var(--link-hover-bg); }
  .crumb.current {
    color: var(--fg);
    cursor: default;
    font-weight: 600;
  }
  .crumb.current:hover { background: none; }

  .crumb-sep { color: var(--muted); margin: 0 2px; }

  /* --- Diagram area --- */
  #diagram-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }
  #diagram-area.panning { cursor: grabbing; }

  #svg-container {
    position: absolute;
    transform-origin: 0 0;
  }

  /* Make clickable nodes stand out */
  #svg-container .node.clickable { cursor: pointer; }
  #svg-container .node.clickable:hover rect,
  #svg-container .node.clickable:hover polygon,
  #svg-container .node.clickable:hover .basic.label-container {
    filter: brightness(1.15);
    stroke-width: 2.5px;
  }

  .render-error { padding: 40px; color: var(--error); }

  /* --- Tooltip --- */
  #tooltip {
    display: none;
    position: fixed;
    z-index: 1000;
    background: var(--tt-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    max-width: 420px;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 4px 16px var(--shadow);
    pointer-events: none;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #tooltip .tt-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--tt-strong);
    margin-bottom: 4px;
  }
  #tooltip .tt-badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    font-weight: 400;
  }
  #tooltip .tt-badge.start_point { background: var(--badge-start-bg); color: var(--badge-start-fg); }
  #tooltip .tt-badge.process { background: var(--badge-process-bg); color: var(--badge-process-fg); }
  #tooltip .tt-badge.end_point { background: var(--badge-end-bg); color: var(--badge-end-fg); }
  #tooltip .tt-badge.updated { background: var(--badge-updated-bg); color: var(--badge-updated-fg); }
  #tooltip .tt-badge.new { background: var(--badge-new-bg); color: var(--badge-new-fg); }
  #tooltip .tt-desc { color: var(--tt-desc); margin-bottom: 6px; }
  #tooltip .tt-file {
    color: var(--tt-file);
    font-size: 12px;
    font-family: monospace;
    word-break: break-all;
  }
  #tooltip .tt-update {
    color: var(--tt-update);
    font-style: italic;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--tt-sep);
    font-size: 12px;
  }
  #tooltip .tt-edge-label { font-weight: 600; color: var(--link); margin-bottom: 4px; }
  #tooltip .tt-row { color: var(--tt-row); font-size: 12px; }
  #tooltip .tt-row span { color: var(--fg); }

  /* --- Legend --- */
  #legend {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 100;
    background: var(--legend-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--legend-fg);
    line-height: 1.6;
    box-shadow: 0 2px 8px var(--shadow);
    pointer-events: auto;
  }
  #legend .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 22px;
  }
  #legend .legend-sep {
    border-top: 1px solid var(--legend-sep);
    margin: 6px 0;
  }
  #legend .legend-hint {
    color: var(--legend-hint);
    font-size: 11px;
    padding-left: 2px;
  }

  /* --- Code panel --- */
  #code-panel {
    display: none;
    flex-direction: column;
    height: 38vh;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--code-bg);
  }
  #code-panel.open { display: flex; }
  #code-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  #code-title { font-weight: 600; }
  #code-loc { color: var(--tt-file); font-family: monospace; font-size: 12px; word-break: break-all; }
  #code-close {
    margin-left: auto;
    background: none;
    border: 1px solid var(--btn-border);
    color: var(--btn-fg);
    border-radius: 4px;
    padding: 1px 8px;
    cursor: pointer;
  }
  #code-close:hover { background: var(--btn-hover); }
  #code-body {
    flex: 1;
    overflow: auto;
    font-family: Consolas, 'SF Mono', Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--code-fg);
    padding: 6px 0;
    tab-size: 4;
  }
  #code-body .cl { display: flex; white-space: pre; padding-right: 16px; min-width: max-content; }
  #code-body .cl.def { background: var(--code-def-bg); }
  #code-body .cl.call { background: var(--code-call-bg); }
  #code-body .ln {
    flex-shrink: 0;
    width: 56px;
    padding-right: 14px;
    text-align: right;
    color: var(--code-ln);
    user-select: none;
  }
  #code-body .note { padding: 6px 16px; color: var(--tt-file); font-family: inherit; white-space: normal; }

  /* --- Loading --- */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--muted);
  }
</style>
<script>
  // Apply the theme before first paint: saved choice, else the OS preference.
  (function() {
    var theme = null;
    try { theme = localStorage.getItem('noodles-theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div id="breadcrumb-bar">
  <button id="back-btn" disabled>&larr; Back</button>
  <div id="breadcrumb"></div>
  <div id="orient-tools">
    <button class="orient-btn" id="rotate-ccw-btn" title="Rotate 90&deg; counter-clockwise (Shift+R)">&#8634;</button>
    <button class="orient-btn" id="rotate-cw-btn" title="Rotate 90&deg; clockwise (R)">&#8635;</button>
    <button class="orient-btn" id="flip-h-btn" title="Flip horizontally (H)">&#8596;</button>
    <button class="orient-btn" id="flip-v-btn" title="Flip vertically (V)">&#8597;</button>
    <button class="orient-btn" id="orient-reset-btn" title="Reset orientation (O)">&#10226;</button>
  </div>
  <button id="theme-btn" title="Toggle light/dark theme (T)"></button>
</div>

<div id="diagram-area">
  <div id="svg-container"></div>
  <div id="loading">Loading diagrams...</div>
  <div id="legend">
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><polygon points="5,0 15,0 20,8 15,16 5,16 0,8" fill="none" stroke="#4db6ac" stroke-width="1.5"/></svg>
      <span>Start Point</span>
    </div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" style="fill:var(--lg-process-fill)" stroke="#64b5f6" stroke-width="1.5"/></svg>
      <span>Process</span>
    </div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="7" style="fill:var(--lg-end-fill)" stroke="#e57373" stroke-width="1.5"/></svg>
      <span>End Point</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-row">
      <span style="font-size:11px;font-weight:600;color:var(--legend-fg);width:20px;text-align:center">[+]</span>
      <span>Has subdiagram</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" style="fill:var(--lg-updated-fill)" stroke="#f9a825" stroke-width="1.5"/></svg>
      <span>Updated</span>
    </div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" style="fill:var(--lg-new-fill)" stroke="#66bb6a" stroke-width="1.5"/></svg>
      <span>New</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-hint">Click [+] node to jump</div>
    <div class="legend-hint">Hover node for details</div>
    <div class="legend-hint">Click node or label for code</div>
    <div class="legend-hint">(Shift+click a [+] node)</div>
    <div class="legend-hint">T to switch theme</div>
    <div class="legend-hint">R / Shift+R rotate, H / V flip, O reset</div>
    <div class="legend-hint">F to fit the view</div>
  </div>
</div>

<div id="code-panel">
  <div id="code-header">
    <span id="code-title"></span>
    <span id="code-loc"></span>
    <button id="code-close" title="Close (Esc)">&times;</button>
  </div>
  <div id="code-body"></div>
</div>

<div id="tooltip"></div>

<script>
(function() {
  // ---- HTML escaping for XSS prevention ----
  function escapeHtml(str) {
    if (str == null) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  // ---- State ----
  let DATA = null;       // data bundle from /api/data
  let navStack = [];     // [{diagramName, title}]
  let currentDiagram = null;

  // Pan & zoom state
  let zoom = 1;
  let panX = 0, panY = 0;
  let isPanning = false;
  let panMoved = false;  // true once a drag moves, so the click that ends it is ignored
  let panStartX = 0, panStartY = 0;
  let panStartPanX = 0, panStartPanY = 0;

  // Touch state
  let lastTouchCenter = null;
  let lastTouchDistance = null;

  const MIN_ZOOM = 0.1;
  const MAX_ZOOM = 5;

  // DOM refs
  const area = document.getElementById('diagram-area');
  const container = document.getElementById('svg-container');
  const tooltip = document.getElementById('tooltip');
  const breadcrumb = document.getElementById('breadcrumb');
  const backBtn = document.getElementById('back-btn');
  const loading = document.getElementById('loading');
  const themeBtn = document.getElementById('theme-btn');

  // ---- Theme ----
  // Priority: the viewer's saved choice > the result's default (NOODLES_THEME) > OS preference.
  const THEME_KEY = 'noodles-theme';
  let theme = document.documentElement.getAttribute('data-theme') || 'light';
  let themeDefaultApplied = false;

  // Diagram class colours are written for a light background; brighter text
  // and darker fills keep them readable on dark.
  const DARK_CLASSDEFS = {
    start: 'fill:none,stroke:#4db6ac,color:#80cbc4',
    process: 'fill:none,stroke:#64b5f6,color:#90caf9',
    endpoint: 'fill:none,stroke:#e57373,color:#ef9a9a',
    updated: 'fill:#3d340c,stroke:#f9a825,color:#ffe082',
    new: 'fill:#1b3320,stroke:#66bb6a,color:#a5d6a7',
  };

  function savedTheme() {
    try {
      const t = localStorage.getItem(THEME_KEY);
      return t === 'light' || t === 'dark' ? t : null;
    } catch (e) {
      return null;
    }
  }

  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      theme: theme === 'dark' ? 'dark' : 'default',
      flowchart: { curve: 'basis', useMaxWidth: false },
      securityLevel: 'strict',
    });
  }

  function themedSource(source) {
    if (theme !== 'dark') return source;
    return source.replace(/^(\s*classDef\s+)(\w+)\s+.*$/gm, (line, prefix, cls) =>
      DARK_CLASSDEFS[cls] ? prefix + cls + ' ' + DARK_CLASSDEFS[cls] : line
    );
  }

  function setTheme(next, { save = false } = {}) {
    theme = next;
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? 'Light' : 'Dark';
    if (save) {
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    initMermaid();
    if (currentDiagram) renderDiagram(currentDiagram, { keepView: true });
  }

  // Once data has loaded, use the result's default theme unless the viewer chose one
  function applyDefaultTheme() {
    if (themeDefaultApplied) return;
    themeDefaultApplied = true;
    const preset = DATA && DATA.theme;
    if (!savedTheme() && (preset === 'light' || preset === 'dark') && preset !== theme) {
      theme = preset;
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? 'Light' : 'Dark';
      initMermaid();
    }
  }

  themeBtn.textContent = theme === 'dark' ? 'Light' : 'Dark';
  themeBtn.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark', { save: true }));

  // Follow OS changes while nothing has been chosen explicitly
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = (e) => {
      const preset = DATA && DATA.theme;
      if (!savedTheme() && preset !== 'light' && preset !== 'dark') {
        setTheme(e.matches ? 'dark' : 'light');
      }
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }

  // ---- Init ----
  initMermaid();

  fetch('/api/data')
    .then(r => r.json())
    .then(data => {
      DATA = data;
      loading.style.display = 'none';
      navigateTo('main', 'Main');
    })
    .catch(err => {
      loading.textContent = 'Failed to load data: ' + err.message;
    });

  // ---- Rendering ----
  let renderCounter = 0;

  async function renderDiagram(name, { keepView = false } = {}) {
    applyDefaultTheme();
    currentDiagram = name;
    const source = DATA.diagrams[name];
    if (!source) {
      container.innerHTML = '<p class="render-error">Diagram not found: ' + escapeHtml(name) + '</p>';
      return;
    }

    renderCounter++;
    const id = 'mermaid-' + renderCounter;

    try {
      const { svg } = await mermaid.render(id, themedSource(source));
      container.innerHTML = svg;
      if (keepView) {
        measureContent();
        applyTransform();
      } else {
        resetView();
      }
      attachInteractions();
    } catch (err) {
      container.innerHTML = '<p class="render-error">Render error: ' + escapeHtml(err.message) + '</p>';
    }
  }

  // ---- Orientation (rotate / flip) ----
  // The diagram is drawn as
  //   translate(pan) scale(zoom) translate(W'/2, H'/2) matrix(M) translate(-W/2, -H/2)
  // i.e. turned/mirrored about its own centre by M (a 90-degree rotation and/or
  // flip, as CSS matrix(a, b, c, d)), then laid out at its oriented size W' x H'.
  // M doesn't depend on zoom, so pan/zoom math (zoom-to-mouse, pinch) is unchanged.
  const ORIENT_KEY = 'noodles-orientation';
  const IDENTITY = [1, 0, 0, 1];
  const ROTATE_CW = [0, 1, -1, 0];
  const ROTATE_CCW = [0, -1, 1, 0];
  const FLIP_H = [-1, 0, 0, 1];
  const FLIP_V = [1, 0, 0, -1];
  let orient = loadOrientation();
  let contentW = 0, contentH = 0;  // natural (unrotated) diagram size at zoom 1

  function loadOrientation() {
    try {
      const m = JSON.parse(localStorage.getItem(ORIENT_KEY));
      // Accept only the 8 rotation/flip matrices: entries in {-1,0,1}, one non-zero per row/column
      if (Array.isArray(m) && m.length === 4 && m.every(v => v === 0 || v === 1 || v === -1)
          && Math.abs(m[0] * m[3] - m[1] * m[2]) === 1
          && (m[0] === 0) === (m[3] === 0) && (m[1] === 0) === (m[2] === 0)
          && (m[0] === 0) !== (m[1] === 0)) {
        return m;
      }
    } catch (e) {}
    return IDENTITY.slice();
  }

  // Compose CSS matrices: the result applies B first, then A
  function multiply(A, B) {
    return [
      A[0] * B[0] + A[2] * B[1],
      A[1] * B[0] + A[3] * B[1],
      A[0] * B[2] + A[2] * B[3],
      A[1] * B[2] + A[3] * B[3],
    ];
  }

  function orientedSize(m = orient) {
    return [
      Math.abs(m[0]) * contentW + Math.abs(m[2]) * contentH,
      Math.abs(m[1]) * contentW + Math.abs(m[3]) * contentH,
    ];
  }

  function measureContent() {
    const svgEl = container.querySelector('svg');
    if (!svgEl) return;
    svgEl.style.maxWidth = 'none';
    svgEl.style.height = 'auto';
    const saved = container.style.transform;
    container.style.transform = 'none';
    const rect = svgEl.getBoundingClientRect();
    container.style.transform = saved;
    contentW = rect.width;
    contentH = rect.height;
  }

  // Change orientation while keeping the point at the centre of the view in place
  function setOrientation(next) {
    const areaRect = area.getBoundingClientRect();
    const cx = areaRect.width / 2, cy = areaRect.height / 2;
    const [ow, oh] = orientedSize();
    // Centre point in the oriented frame, relative to the diagram's centre: M(p - c)
    const fx = (cx - panX) / zoom - ow / 2;
    const fy = (cy - panY) / zoom - oh / 2;
    // Back to natural coordinates: M is orthogonal, so M^-1 = M^T
    const [a, b, c, d] = orient;
    const px = a * fx + b * fy;
    const py = c * fx + d * fy;

    orient = next;
    try { localStorage.setItem(ORIENT_KEY, JSON.stringify(orient)); } catch (e) {}

    const [a2, b2, c2, d2] = orient;
    const [ow2, oh2] = orientedSize();
    panX = cx - zoom * (a2 * px + c2 * py + ow2 / 2);
    panY = cy - zoom * (b2 * px + d2 * py + oh2 / 2);
    applyTransform();
    updateOrientButtons();
  }

  function updateOrientButtons() {
    const turned = orient.join(',') !== IDENTITY.join(',');
    document.getElementById('orient-reset-btn').classList.toggle('active', turned);
  }

  function rotateCW() { setOrientation(multiply(ROTATE_CW, orient)); }
  function rotateCCW() { setOrientation(multiply(ROTATE_CCW, orient)); }
  // Flips mirror the diagram as it currently appears on screen
  function flipH() { setOrientation(multiply(FLIP_H, orient)); }
  function flipV() { setOrientation(multiply(FLIP_V, orient)); }
  function resetOrientation() { setOrientation(IDENTITY.slice()); }

  document.getElementById('rotate-cw-btn').addEventListener('click', rotateCW);
  document.getElementById('rotate-ccw-btn').addEventListener('click', rotateCCW);
  document.getElementById('flip-h-btn').addEventListener('click', flipH);
  document.getElementById('flip-v-btn').addEventListener('click', flipV);
  document.getElementById('orient-reset-btn').addEventListener('click', resetOrientation);
  updateOrientButtons();

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;
    measureContent();

    const areaRect = area.getBoundingClientRect();
    const [ow, oh] = orientedSize();
    if (ow > 0 && oh > 0) {
      const scaleX = areaRect.width / ow;
      const scaleY = areaRect.height / oh;
      zoom = Math.min(scaleX, scaleY, 1.5) * 0.9;

      // Center the (oriented) diagram in the viewport
      panX = (areaRect.width - ow * zoom) / 2;
      panY = (areaRect.height - oh * zoom) / 2;
    }
    applyTransform();
  }

  function applyTransform() {
    const [a, b, c, d] = orient;
    const [ow, oh] = orientedSize();
    container.style.transform =
      `translate(${panX}px, ${panY}px) scale(${zoom}) ` +
      `translate(${ow / 2}px, ${oh / 2}px) matrix(${a}, ${b}, ${c}, ${d}, 0, 0) ` +
      `translate(${-contentW / 2}px, ${-contentH / 2}px)`;
  }

  // ---- Interactions: hover + click ----
  function attachInteractions() {
    const svgEl = container.querySelector('svg');
    if (!svgEl) return;

    const nav = DATA.navigation[currentDiagram] || {};

    // Process nodes
    const nodeEls = svgEl.querySelectorAll('.node');
    nodeEls.forEach(nodeEl => {
      const mermaidId = extractNodeId(nodeEl);
      if (!mermaidId) return;

      const originalId = DATA.id_map[mermaidId];
      const meta = originalId ? DATA.nodes[originalId] : null;

      // Hover tooltip
      nodeEl.addEventListener('mouseenter', (e) => showNodeTooltip(e, meta, mermaidId));
      nodeEl.addEventListener('mousemove', (e) => positionTooltip(e));
      nodeEl.addEventListener('mouseleave', () => hideTooltip());

      // Click: nodes with a sub-diagram navigate (Shift+click shows code);
      // other nodes show their code
      nodeEl.classList.add('clickable');
      nodeEl.addEventListener('click', (e) => {
        e.stopPropagation();
        hideTooltip();
        if (nav[mermaidId] && !e.shiftKey) {
          const targetDiagram = nav[mermaidId];
          const title = meta ? meta.name : targetDiagram;
          navigateTo(targetDiagram, title);
        } else if (originalId) {
          showNodeCode(originalId);
        }
      });
    });

    // Process edge labels
    const edgeLabelEls = svgEl.querySelectorAll('.edgeLabel');
    edgeLabelEls.forEach(labelEl => {
      labelEl.addEventListener('mouseenter', (e) => showEdgeTooltip(e, labelEl));
      labelEl.addEventListener('mousemove', (e) => positionTooltip(e));
      labelEl.addEventListener('mouseleave', () => hideTooltip());
      labelEl.addEventListener('click', (e) => {
        if (panMoved) return;
        const edgeMeta = findEdgeByLabel(labelEl);
        if (edgeMeta) {
          e.stopPropagation();
          hideTooltip();
          showEdgeCode(edgeMeta);
        }
      });
    });
  }

  // ---- Code panel ----
  const codePanel = document.getElementById('code-panel');
  const codeTitle = document.getElementById('code-title');
  const codeLoc = document.getElementById('code-loc');
  const codeBody = document.getElementById('code-body');
  const CONTEXT_LINES = 10;

  document.getElementById('code-close').addEventListener('click', closeCode);

  function closeCode() {
    codePanel.classList.remove('open');
  }

  function openCode(title, loc, html) {
    codeTitle.textContent = title;
    codeLoc.textContent = loc;
    codeBody.innerHTML = html;
    codePanel.classList.add('open');
    const target = codeBody.querySelector('.cl.focus') || codeBody.querySelector('.cl.def');
    if (target) target.scrollIntoView({ block: 'center' });
  }

  function fileOf(id) {
    return id.includes('::') ? id.split('::')[0] : '';
  }

  // A snippet is stored as segments of the function: [{offset, code}], offsets
  // relative to its first line. Render lines [from, to) of one segment.
  function renderSegment(snip, seg, from, to, marks, titles) {
    const lines = seg.code.split('\n');
    let html = '';
    for (let i = Math.max(0, from); i < Math.min(lines.length, to); i++) {
      const lineNo = snip.line + seg.offset + i;
      const cls = marks[lineNo] || '';
      const title = titles[lineNo] ? ` title="${escapeHtml(titles[lineNo])}"` : '';
      html += `<div class="cl ${cls}"${title}><span class="ln">${lineNo}</span><span>${escapeHtml(lines[i]) || ' '}</span></div>`;
    }
    return html;
  }

  function gapNote(fromLine, toLine) {
    return `<div class="note">&middot;&middot;&middot; lines ${fromLine}&ndash;${toLine} not stored &middot;&middot;&middot;</div>`;
  }

  function segmentEnd(seg) {
    return seg.offset + seg.code.split('\n').length;  // exclusive, relative
  }

  function noCodeNote(meta) {
    return '<div class="note">No code stored for this map. Re-run the analysis to include code excerpts.</div>';
  }

  function showNodeCode(nodeId) {
    const meta = DATA.nodes[nodeId] || {};
    const snip = (DATA.snippets || {})[nodeId];
    const loc = fileOf(nodeId) + (meta.line ? ':' + meta.line : '');
    const title = meta.name || nodeId.split('::').pop();
    if (!snip) {
      openCode(title, loc, noCodeNote(meta));
      return;
    }
    // Highlight the definition line and every call site to another mapped function
    const marks = { [snip.line]: 'def' };
    const titles = {};
    Object.values(DATA.edges).forEach(edge => {
      if (edge.from === nodeId && edge.line && edge.line !== snip.line) {
        marks[edge.line] = 'call';
        const callee = DATA.nodes[edge.to];
        titles[edge.line] = 'calls ' + (callee ? callee.name : edge.to.split('::').pop());
      }
    });
    let html = '';
    let shownTo = 0;  // relative offset reached so far
    (snip.segments || []).forEach(seg => {
      if (seg.offset > shownTo) html += gapNote(snip.line + shownTo, snip.line + seg.offset - 1);
      html += renderSegment(snip, seg, 0, Infinity, marks, titles);
      shownTo = segmentEnd(seg);
    });
    if (snip.total_lines > shownTo) {
      html += gapNote(snip.line + shownTo, snip.line + snip.total_lines - 1);
    }
    openCode(title, loc, html);
  }

  function showEdgeCode(edge) {
    const caller = DATA.nodes[edge.from] || {};
    const callee = DATA.nodes[edge.to] || {};
    const snip = (DATA.snippets || {})[edge.from];
    const title = (caller.name || edge.from.split('::').pop()) + ' → ' + (callee.name || edge.to.split('::').pop());
    const loc = fileOf(edge.from) + (edge.line ? ':' + edge.line : '');
    if (!snip || !edge.line) {
      openCode(title, loc, noCodeNote(caller));
      return;
    }
    // The call line in the middle, with CONTEXT_LINES before and after
    const offset = edge.line - snip.line;
    const seg = (snip.segments || []).find(s => offset >= s.offset && offset < segmentEnd(s));
    if (!seg) {
      openCode(title, loc, `<div class="note">The call on line ${edge.line} isn't in the stored excerpt (the per-function limit was reached).</div>`);
      return;
    }
    const marks = { [snip.line]: 'def', [edge.line]: 'call focus' };
    const rel = offset - seg.offset;
    openCode(title, loc, renderSegment(snip, seg, rel - CONTEXT_LINES, rel + CONTEXT_LINES + 1, marks, {}));
  }

  // Edge labels carry no ids, so match by label text, preferring edges in the current diagram
  function findEdgeByLabel(labelEl) {
    const labelText = (labelEl.textContent || '').trim().replace(/^"|"$/g, '');
    if (!labelText) return null;
    const source = DATA.diagrams[currentDiagram] || '';
    let fallback = null;
    for (const [key, meta] of Object.entries(DATA.edges)) {
      if (meta.label !== labelText) continue;
      const [fromId, toId] = key.split(' -> ');
      if (source.includes(fromId) && source.includes(toId)) return meta;
      if (!fallback) fallback = meta;
    }
    return fallback;
  }

  function extractNodeId(nodeEl) {
    const id = nodeEl.id || '';
    // mermaid v11 format: "flowchart-{nodeId}-{index}"
    const match = id.match(/^flowchart-(.+)-\d+$/);
    if (match) return match[1];
    // Fallback: try data-id attribute
    if (nodeEl.dataset && nodeEl.dataset.id) return nodeEl.dataset.id;
    return null;
  }

  // ---- Tooltips ----
  function showNodeTooltip(e, meta, mermaidId) {
    if (!meta) {
      tooltip.innerHTML = `<div class="tt-name">${escapeHtml(mermaidId)}</div>`;
    } else {
      const typeText = escapeHtml((meta.type || '').replace('_',' '));
      const badge = `<span class="tt-badge ${escapeHtml(meta.type)}">${typeText}</span>`;
      const tagHtml = meta.tag ? `<span class="tt-badge ${escapeHtml(meta.tag)}">${escapeHtml(meta.tag)}</span>` : '';
      const updateHtml = (meta.status === 'updated' && meta.update)
        ? `<div class="tt-update">${escapeHtml(meta.update)}</div>`
        : '';
      tooltip.innerHTML = `
        <div class="tt-name">${escapeHtml(meta.name)}${badge}${tagHtml}</div>
        ${meta.description ? `<div class="tt-desc">${escapeHtml(meta.description)}</div>` : ''}
        ${meta.file_path ? `<div class="tt-file">${escapeHtml(meta.file_path)}${meta.line ? ':' + escapeHtml(meta.line) : ''} &middot; ${escapeHtml(meta.function)}</div>` : ''}
        ${updateHtml}
      `;
    }
    tooltip.style.display = 'block';
    positionTooltip(e);
  }

  function showEdgeTooltip(e, labelEl) {
    const labelText = (labelEl.textContent || '').trim().replace(/^"|"$/g, '');
    const edgeMeta = findEdgeByLabel(labelEl);

    if (edgeMeta) {
      let html = `<div class="tt-edge-label">${escapeHtml(edgeMeta.label)}</div>`;
      if (edgeMeta.description) html += `<div class="tt-desc">${escapeHtml(edgeMeta.description)}</div>`;
      if (edgeMeta.line) {
        html += `<div class="tt-row">Called at: <span>${escapeHtml(fileOf(edgeMeta.from))}:${escapeHtml(edgeMeta.line)}</span></div>`;
      }
      const idx = edgeMeta.index != null ? escapeHtml(edgeMeta.index) : 'N/A';
      html += `<div class="tt-row">Index: <span>${idx}</span></div>`;
      const cond = escapeHtml(edgeMeta.condition) || 'None';
      html += `<div class="tt-row">Condition: <span>${cond}</span></div>`;
      tooltip.innerHTML = html;
    } else {
      tooltip.innerHTML = `<div class="tt-edge-label">${escapeHtml(labelText)}</div>`;
    }
    tooltip.style.display = 'block';
    positionTooltip(e);
  }

  function positionTooltip(e) {
    const pad = 12;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    // Keep tooltip within viewport
    const rect = tooltip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  // ---- Navigation ----
  function navigateTo(diagramName, title) {
    navStack.push({ name: diagramName, title: title || diagramName });
    renderDiagram(diagramName);
    updateBreadcrumb();
  }

  function navigateBack() {
    if (navStack.length <= 1) return;
    navStack.pop();
    const current = navStack[navStack.length - 1];
    renderDiagram(current.name);
    updateBreadcrumb();
  }

  function navigateToIndex(index) {
    if (index >= navStack.length - 1) return; // Already here
    navStack = navStack.slice(0, index + 1);
    const current = navStack[navStack.length - 1];
    renderDiagram(current.name);
    updateBreadcrumb();
  }

  function updateBreadcrumb() {
    backBtn.disabled = navStack.length <= 1;

    let html = '';
    navStack.forEach((item, i) => {
      if (i > 0) html += '<span class="crumb-sep">›</span>';
      const isCurrent = i === navStack.length - 1;
      html += `<span class="crumb ${isCurrent ? 'current' : ''}" data-index="${i}">${escapeHtml(item.title)}</span>`;
    });
    breadcrumb.innerHTML = html;

    // Attach click handlers
    breadcrumb.querySelectorAll('.crumb:not(.current)').forEach(el => {
      el.addEventListener('click', () => {
        navigateToIndex(parseInt(el.dataset.index));
      });
    });
  }

  backBtn.addEventListener('click', navigateBack);

  // ---- Pan ----
  area.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    // Don't start pan if clicking a node
    if (e.target.closest('.node')) return;
    isPanning = true;
    panMoved = false;
    area.classList.add('panning');
    panStartX = e.clientX;
    panStartY = e.clientY;
    panStartPanX = panX;
    panStartPanY = panY;
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    if (Math.abs(e.clientX - panStartX) + Math.abs(e.clientY - panStartY) > 4) panMoved = true;
    panX = panStartPanX + (e.clientX - panStartX);
    panY = panStartPanY + (e.clientY - panStartY);
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    area.classList.remove('panning');
  });

  // ---- Zoom (wheel) ----
  area.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = area.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const factor = Math.pow(1.1, -e.deltaY / 50);
    const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));

    // Zoom toward mouse position
    panX = mouseX - (mouseX - panX) * (newZoom / zoom);
    panY = mouseY - (mouseY - panY) * (newZoom / zoom);
    zoom = newZoom;

    applyTransform();
  }, { passive: false });

  // ---- Touch: pinch zoom + pan ----
  area.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      lastTouchCenter = getTouchCenter(e.touches);
      lastTouchDistance = getTouchDistance(e.touches);
    }
  }, { passive: false });

  area.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2 || !lastTouchDistance) return;
    e.preventDefault();

    const center = getTouchCenter(e.touches);
    const distance = getTouchDistance(e.touches);
    const rect = area.getBoundingClientRect();

    // Pinch zoom
    const factor = distance / lastTouchDistance;
    const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    const anchorX = center.x - rect.left;
    const anchorY = center.y - rect.top;
    panX = anchorX - (anchorX - panX) * (newZoom / zoom);
    panY = anchorY - (anchorY - panY) * (newZoom / zoom);
    zoom = newZoom;

    // Pan
    if (lastTouchCenter) {
      panX += center.x - lastTouchCenter.x;
      panY += center.y - lastTouchCenter.y;
    }

    lastTouchCenter = center;
    lastTouchDistance = distance;
    applyTransform();
  }, { passive: false });

  area.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      lastTouchCenter = null;
      lastTouchDistance = null;
    }
  });

  function getTouchCenter(touches) {
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2,
    };
  }
  function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  // ---- Keyboard ----
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (codePanel.classList.contains('open')) {
        closeCode();
      } else {
        navigateBack();
      }
    } else if (e.ctrlKey || e.metaKey || e.altKey) {
      return;
    } else if (e.key === 't' || e.key === 'T') {
      setTheme(theme === 'dark' ? 'light' : 'dark', { save: true });
    } else if (e.key === 'r') {
      rotateCW();
    } else if (e.key === 'R') {
      rotateCCW();
    } else if (e.key === 'h' || e.key === 'H') {
      flipH();
    } else if (e.key === 'v' || e.key === 'V') {
      flipV();
    } else if (e.key === 'o' || e.key === 'O') {
      resetOrientation();
    } else if (e.key === 'f' || e.key === 'F') {
      resetView();
    }
  });
})();
</script>
</body>
</html>

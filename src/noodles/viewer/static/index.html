<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noodles Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* --- Theme colours (light default, dark via [data-theme="dark"]) --- */
  :root {
    color-scheme: light;
    --bg: #fff;
    --fg: #333;
    --bar-bg: #f5f5f5;
    --border: #ddd;
    --btn-border: #ccc;
    --btn-fg: #555;
    --btn-hover: #e0e0e0;
    --link: #1a73e8;
    --link-hover-bg: #e8f0fe;
    --muted: #999;
    --error: #f66;
    --tt-bg: #fff;
    --tt-strong: #222;
    --tt-desc: #555;
    --tt-file: #888;
    --tt-sep: #eee;
    --tt-row: #666;
    --tt-update: #f57f17;
    --shadow: rgba(0, 0, 0, 0.12);
    --legend-bg: rgba(255, 255, 255, 0.92);
    --legend-fg: #555;
    --legend-sep: #e0e0e0;
    --legend-hint: #888;
    --badge-start-bg: #e0f2f1;    --badge-start-fg: #00695c;
    --badge-process-bg: #d6e4f0;  --badge-process-fg: #1a4a7a;
    --badge-end-bg: #f8d7da;      --badge-end-fg: #721c24;
    --badge-updated-bg: #fff9c4;  --badge-updated-fg: #f57f17;
    --badge-new-bg: #c8e6c9;      --badge-new-fg: #2e7d32;
    --lg-process-fill: #e3f2fd;
    --lg-end-fill: #fce4ec;
    --lg-updated-fill: #fff9c4;
    --lg-new-fill: #c8e6c9;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1f22;
    --fg: #d4d4d4;
    --bar-bg: #2b2d30;
    --border: #3c3f44;
    --btn-border: #555;
    --btn-fg: #c8c8c8;
    --btn-hover: #3a3d41;
    --link: #8ab4f8;
    --link-hover-bg: #2d3748;
    --muted: #8a8a8a;
    --error: #ff8a80;
    --tt-bg: #2b2d30;
    --tt-strong: #eee;
    --tt-desc: #bbb;
    --tt-file: #999;
    --tt-sep: #3c3f44;
    --tt-row: #aaa;
    --tt-update: #ffb74d;
    --shadow: rgba(0, 0, 0, 0.5);
    --legend-bg: rgba(43, 45, 48, 0.92);
    --legend-fg: #c8c8c8;
    --legend-sep: #3c3f44;
    --legend-hint: #8a8a8a;
    --badge-start-bg: #12312e;    --badge-start-fg: #80cbc4;
    --badge-process-bg: #1c2f45;  --badge-process-fg: #90caf9;
    --badge-end-bg: #3d1d21;      --badge-end-fg: #ef9a9a;
    --badge-updated-bg: #3d340c;  --badge-updated-fg: #ffe082;
    --badge-new-bg: #1b3320;      --badge-new-fg: #a5d6a7;
    --lg-process-fill: #1c2f45;
    --lg-end-fill: #3d1d21;
    --lg-updated-fill: #3d340c;
    --lg-new-fill: #1b3320;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Breadcrumb bar --- */
  #breadcrumb-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 44px;
  }

  #back-btn, #theme-btn {
    background: none;
    border: 1px solid var(--btn-border);
    color: var(--btn-fg);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  #back-btn:hover, #theme-btn:hover { background: var(--btn-hover); }
  #back-btn:disabled { opacity: 0.3; cursor: default; }
  #back-btn:disabled:hover { background: none; }
  #theme-btn { margin-left: auto; }

  #breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    font-size: 14px;
  }

  .crumb {
    color: var(--link);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .crumb:hover { background: var(--link-hover-bg); }
  .crumb.current {
    color: var(--fg);
    cursor: default;
    font-weight: 600;
  }
  .crumb.current:hover { background: none; }

  .crumb-sep { color: var(--muted); margin: 0 2px; }

  /* --- Diagram area --- */
  #diagram-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }
  #diagram-area.panning { cursor: grabbing; }

  #svg-container {
    position: absolute;
    transform-origin: 0 0;
  }

  /* Make clickable nodes stand out */
  #svg-container .node.clickable { cursor: pointer; }
  #svg-container .node.clickable:hover rect,
  #svg-container .node.clickable:hover polygon,
  #svg-container .node.clickable:hover .basic.label-container {
    filter: brightness(1.15);
    stroke-width: 2.5px;
  }

  .render-error { padding: 40px; color: var(--error); }

  /* --- Tooltip --- */
  #tooltip {
    display: none;
    position: fixed;
    z-index: 1000;
    background: var(--tt-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    max-width: 420px;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 4px 16px var(--shadow);
    pointer-events: none;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #tooltip .tt-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--tt-strong);
    margin-bottom: 4px;
  }
  #tooltip .tt-badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    font-weight: 400;
  }
  #tooltip .tt-badge.start_point { background: var(--badge-start-bg); color: var(--badge-start-fg); }
  #tooltip .tt-badge.process { background: var(--badge-process-bg); color: var(--badge-process-fg); }
  #tooltip .tt-badge.end_point { background: var(--badge-end-bg); color: var(--badge-end-fg); }
  #tooltip .tt-badge.updated { background: var(--badge-updated-bg); color: var(--badge-updated-fg); }
  #tooltip .tt-badge.new { background: var(--badge-new-bg); color: var(--badge-new-fg); }
  #tooltip .tt-desc { color: var(--tt-desc); margin-bottom: 6px; }
  #tooltip .tt-file {
    color: var(--tt-file);
    font-size: 12px;
    font-family: monospace;
    word-break: break-all;
  }
  #tooltip .tt-update {
    color: var(--tt-update);
    font-style: italic;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--tt-sep);
    font-size: 12px;
  }
  #tooltip .tt-edge-label { font-weight: 600; color: var(--link); margin-bottom: 4px; }
  #tooltip .tt-row { color: var(--tt-row); font-size: 12px; }
  #tooltip .tt-row span { color: var(--fg); }

  /* --- Legend --- */
  #legend {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 100;
    background: var(--legend-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--legend-fg);
    line-height: 1.6;
    box-shadow: 0 2px 8px var(--shadow);
    pointer-events: auto;
  }
  #legend .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 22px;
  }
  #legend .legend-sep {
    border-top: 1px solid var(--legend-sep);
    margin: 6px 0;
  }
  #legend .legend-hint {
    color: var(--legend-hint);
    font-size: 11px;
    padding-left: 2px;
  }

  /* --- Loading --- */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--muted);
  }
</style>
<script>
  // Apply the theme before first paint: saved choice, else the OS preference.
  (function() {
    var theme = null;
    try { theme = localStorage.getItem('noodles-theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div id="breadcrumb-bar">
  <button id="back-btn" disabled>&larr; Back</button>
  <div id="breadcrumb"></div>
  <button id="theme-btn" title="Toggle light/dark theme (T)"></button>
</div>

<div id="diagram-area">
  <div id="svg-container"></div>
  <div id="loading">Loading diagrams...</div>
  <div id="legend">
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><polygon points="5,0 15,0 20,8 15,16 5,16 0,8" fill="none" stroke="#4db6ac" stroke-width="1.5"/></svg>
      <span>Start Point</span>
    </div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" style="fill:var(--lg-process-fill)" stroke="#64b5f6" stroke-width="1.5"/></svg>
      <span>Process</span>
    </div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="7" style="fill:var(--lg-end-fill)" stroke="#e57373" stroke-width="1.5"/></svg>
      <span>End Point</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-row">
      <span style="font-size:11px;font-weight:600;color:var(--legend-fg);width:20px;text-align:center">[+]</span>
      <span>Has subdiagram</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" style="fill:var(--lg-updated-fill)" stroke="#f9a825" stroke-width="1.5"/></svg>
      <span>Updated</span>
    </div>
    <div class="legend-row">
      <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" style="fill:var(--lg-new-fill)" stroke="#66bb6a" stroke-width="1.5"/></svg>
      <span>New</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-hint">Click [+] node to jump</div>
    <div class="legend-hint">Hover node for details</div>
    <div class="legend-hint">T to switch theme</div>
  </div>
</div>

<div id="tooltip"></div>

<script>
(function() {
  // ---- HTML escaping for XSS prevention ----
  function escapeHtml(str) {
    if (str == null) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  // ---- State ----
  let DATA = null;       // data bundle from /api/data
  let navStack = [];     // [{diagramName, title}]
  let currentDiagram = null;

  // Pan & zoom state
  let zoom = 1;
  let panX = 0, panY = 0;
  let isPanning = false;
  let panStartX = 0, panStartY = 0;
  let panStartPanX = 0, panStartPanY = 0;

  // Touch state
  let lastTouchCenter = null;
  let lastTouchDistance = null;

  const MIN_ZOOM = 0.1;
  const MAX_ZOOM = 5;

  // DOM refs
  const area = document.getElementById('diagram-area');
  const container = document.getElementById('svg-container');
  const tooltip = document.getElementById('tooltip');
  const breadcrumb = document.getElementById('breadcrumb');
  const backBtn = document.getElementById('back-btn');
  const loading = document.getElementById('loading');
  const themeBtn = document.getElementById('theme-btn');

  // ---- Theme ----
  // Priority: the viewer's saved choice > the result's default (NOODLES_THEME) > OS preference.
  const THEME_KEY = 'noodles-theme';
  let theme = document.documentElement.getAttribute('data-theme') || 'light';
  let themeDefaultApplied = false;

  // Diagram class colours are written for a light background; brighter text
  // and darker fills keep them readable on dark.
  const DARK_CLASSDEFS = {
    start: 'fill:none,stroke:#4db6ac,color:#80cbc4',
    process: 'fill:none,stroke:#64b5f6,color:#90caf9',
    endpoint: 'fill:none,stroke:#e57373,color:#ef9a9a',
    updated: 'fill:#3d340c,stroke:#f9a825,color:#ffe082',
    new: 'fill:#1b3320,stroke:#66bb6a,color:#a5d6a7',
  };

  function savedTheme() {
    try {
      const t = localStorage.getItem(THEME_KEY);
      return t === 'light' || t === 'dark' ? t : null;
    } catch (e) {
      return null;
    }
  }

  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      theme: theme === 'dark' ? 'dark' : 'default',
      flowchart: { curve: 'basis', useMaxWidth: false },
      securityLevel: 'strict',
    });
  }

  function themedSource(source) {
    if (theme !== 'dark') return source;
    return source.replace(/^(\s*classDef\s+)(\w+)\s+.*$/gm, (line, prefix, cls) =>
      DARK_CLASSDEFS[cls] ? prefix + cls + ' ' + DARK_CLASSDEFS[cls] : line
    );
  }

  function setTheme(next, { save = false } = {}) {
    theme = next;
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? 'Light' : 'Dark';
    if (save) {
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    initMermaid();
    if (currentDiagram) renderDiagram(currentDiagram, { keepView: true });
  }

  // Once data has loaded, use the result's default theme unless the viewer chose one
  function applyDefaultTheme() {
    if (themeDefaultApplied) return;
    themeDefaultApplied = true;
    const preset = DATA && DATA.theme;
    if (!savedTheme() && (preset === 'light' || preset === 'dark') && preset !== theme) {
      theme = preset;
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? 'Light' : 'Dark';
      initMermaid();
    }
  }

  themeBtn.textContent = theme === 'dark' ? 'Light' : 'Dark';
  themeBtn.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark', { save: true }));

  // Follow OS changes while nothing has been chosen explicitly
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = (e) => {
      const preset = DATA && DATA.theme;
      if (!savedTheme() && preset !== 'light' && preset !== 'dark') {
        setTheme(e.matches ? 'dark' : 'light');
      }
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }

  // ---- Init ----
  initMermaid();

  fetch('/api/data')
    .then(r => r.json())
    .then(data => {
      DATA = data;
      loading.style.display = 'none';
      navigateTo('main', 'Main');
    })
    .catch(err => {
      loading.textContent = 'Failed to load data: ' + err.message;
    });

  // ---- Rendering ----
  let renderCounter = 0;

  async function renderDiagram(name, { keepView = false } = {}) {
    applyDefaultTheme();
    currentDiagram = name;
    const source = DATA.diagrams[name];
    if (!source) {
      container.innerHTML = '<p class="render-error">Diagram not found: ' + escapeHtml(name) + '</p>';
      return;
    }

    renderCounter++;
    const id = 'mermaid-' + renderCounter;

    try {
      const { svg } = await mermaid.render(id, themedSource(source));
      container.innerHTML = svg;
      if (keepView) {
        const svgEl = container.querySelector('svg');
        if (svgEl) {
          svgEl.style.maxWidth = 'none';
          svgEl.style.height = 'auto';
        }
        applyTransform();
      } else {
        resetView();
      }
      attachInteractions();
    } catch (err) {
      container.innerHTML = '<p class="render-error">Render error: ' + escapeHtml(err.message) + '</p>';
    }
  }

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;

    // Reset transform first to measure natural SVG size
    container.style.transform = 'none';

    const svgEl = container.querySelector('svg');
    if (svgEl) {
      svgEl.style.maxWidth = 'none';
      svgEl.style.height = 'auto';
      const svgRect = svgEl.getBoundingClientRect();
      const areaRect = area.getBoundingClientRect();
      if (svgRect.width > 0 && svgRect.height > 0) {
        const scaleX = areaRect.width / svgRect.width;
        const scaleY = areaRect.height / svgRect.height;
        zoom = Math.min(scaleX, scaleY, 1.5) * 0.9;

        // Center the diagram in the viewport
        const scaledW = svgRect.width * zoom;
        const scaledH = svgRect.height * zoom;
        panX = (areaRect.width - scaledW) / 2;
        panY = (areaRect.height - scaledH) / 2;
      }
    }
    applyTransform();
  }

  function applyTransform() {
    container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  // ---- Interactions: hover + click ----
  function attachInteractions() {
    const svgEl = container.querySelector('svg');
    if (!svgEl) return;

    const nav = DATA.navigation[currentDiagram] || {};

    // Process nodes
    const nodeEls = svgEl.querySelectorAll('.node');
    nodeEls.forEach(nodeEl => {
      const mermaidId = extractNodeId(nodeEl);
      if (!mermaidId) return;

      const originalId = DATA.id_map[mermaidId];
      const meta = originalId ? DATA.nodes[originalId] : null;

      // Hover tooltip
      nodeEl.addEventListener('mouseenter', (e) => showNodeTooltip(e, meta, mermaidId));
      nodeEl.addEventListener('mousemove', (e) => positionTooltip(e));
      nodeEl.addEventListener('mouseleave', () => hideTooltip());

      // Click navigation for solid (has sub-diagram) nodes
      if (nav[mermaidId]) {
        nodeEl.classList.add('clickable');
        nodeEl.addEventListener('click', (e) => {
          e.stopPropagation();
          hideTooltip();
          const targetDiagram = nav[mermaidId];
          const title = meta ? meta.name : targetDiagram;
          navigateTo(targetDiagram, title);
        });
      }
    });

    // Process edge labels
    const edgeLabelEls = svgEl.querySelectorAll('.edgeLabel');
    edgeLabelEls.forEach(labelEl => {
      labelEl.addEventListener('mouseenter', (e) => showEdgeTooltip(e, labelEl));
      labelEl.addEventListener('mousemove', (e) => positionTooltip(e));
      labelEl.addEventListener('mouseleave', () => hideTooltip());
    });
  }

  function extractNodeId(nodeEl) {
    const id = nodeEl.id || '';
    // mermaid v11 format: "flowchart-{nodeId}-{index}"
    const match = id.match(/^flowchart-(.+)-\d+$/);
    if (match) return match[1];
    // Fallback: try data-id attribute
    if (nodeEl.dataset && nodeEl.dataset.id) return nodeEl.dataset.id;
    return null;
  }

  // ---- Tooltips ----
  function showNodeTooltip(e, meta, mermaidId) {
    if (!meta) {
      tooltip.innerHTML = `<div class="tt-name">${escapeHtml(mermaidId)}</div>`;
    } else {
      const typeText = escapeHtml((meta.type || '').replace('_',' '));
      const badge = `<span class="tt-badge ${escapeHtml(meta.type)}">${typeText}</span>`;
      const tagHtml = meta.tag ? `<span class="tt-badge ${escapeHtml(meta.tag)}">${escapeHtml(meta.tag)}</span>` : '';
      const updateHtml = (meta.status === 'updated' && meta.update)
        ? `<div class="tt-update">${escapeHtml(meta.update)}</div>`
        : '';
      tooltip.innerHTML = `
        <div class="tt-name">${escapeHtml(meta.name)}${badge}${tagHtml}</div>
        ${meta.description ? `<div class="tt-desc">${escapeHtml(meta.description)}</div>` : ''}
        ${meta.file_path ? `<div class="tt-file">${escapeHtml(meta.file_path)}::${escapeHtml(meta.function)}</div>` : ''}
        ${updateHtml}
      `;
    }
    tooltip.style.display = 'block';
    positionTooltip(e);
  }

  function showEdgeTooltip(e, labelEl) {
    const labelText = (labelEl.textContent || '').trim().replace(/^"|"$/g, '');
    // Find matching edge by label text
    let edgeMeta = null;
    for (const [key, meta] of Object.entries(DATA.edges)) {
      if (meta.label === labelText) {
        edgeMeta = meta;
        break;
      }
    }

    if (edgeMeta) {
      let html = `<div class="tt-edge-label">${escapeHtml(edgeMeta.label)}</div>`;
      if (edgeMeta.description) html += `<div class="tt-desc">${escapeHtml(edgeMeta.description)}</div>`;
      const idx = edgeMeta.index != null ? escapeHtml(edgeMeta.index) : 'N/A';
      html += `<div class="tt-row">Index: <span>${idx}</span></div>`;
      const cond = escapeHtml(edgeMeta.condition) || 'None';
      html += `<div class="tt-row">Condition: <span>${cond}</span></div>`;
      tooltip.innerHTML = html;
    } else {
      tooltip.innerHTML = `<div class="tt-edge-label">${escapeHtml(labelText)}</div>`;
    }
    tooltip.style.display = 'block';
    positionTooltip(e);
  }

  function positionTooltip(e) {
    const pad = 12;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    // Keep tooltip within viewport
    const rect = tooltip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  // ---- Navigation ----
  function navigateTo(diagramName, title) {
    navStack.push({ name: diagramName, title: title || diagramName });
    renderDiagram(diagramName);
    updateBreadcrumb();
  }

  function navigateBack() {
    if (navStack.length <= 1) return;
    navStack.pop();
    const current = navStack[navStack.length - 1];
    renderDiagram(current.name);
    updateBreadcrumb();
  }

  function navigateToIndex(index) {
    if (index >= navStack.length - 1) return; // Already here
    navStack = navStack.slice(0, index + 1);
    const current = navStack[navStack.length - 1];
    renderDiagram(current.name);
    updateBreadcrumb();
  }

  function updateBreadcrumb() {
    backBtn.disabled = navStack.length <= 1;

    let html = '';
    navStack.forEach((item, i) => {
      if (i > 0) html += '<span class="crumb-sep">›</span>';
      const isCurrent = i === navStack.length - 1;
      html += `<span class="crumb ${isCurrent ? 'current' : ''}" data-index="${i}">${escapeHtml(item.title)}</span>`;
    });
    breadcrumb.innerHTML = html;

    // Attach click handlers
    breadcrumb.querySelectorAll('.crumb:not(.current)').forEach(el => {
      el.addEventListener('click', () => {
        navigateToIndex(parseInt(el.dataset.index));
      });
    });
  }

  backBtn.addEventListener('click', navigateBack);

  // ---- Pan ----
  area.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    // Don't start pan if clicking a node
    if (e.target.closest('.node')) return;
    isPanning = true;
    area.classList.add('panning');
    panStartX = e.clientX;
    panStartY = e.clientY;
    panStartPanX = panX;
    panStartPanY = panY;
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    panX = panStartPanX + (e.clientX - panStartX);
    panY = panStartPanY + (e.clientY - panStartY);
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    area.classList.remove('panning');
  });

  // ---- Zoom (wheel) ----
  area.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = area.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const factor = Math.pow(1.1, -e.deltaY / 50);
    const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));

    // Zoom toward mouse position
    panX = mouseX - (mouseX - panX) * (newZoom / zoom);
    panY = mouseY - (mouseY - panY) * (newZoom / zoom);
    zoom = newZoom;

    applyTransform();
  }, { passive: false });

  // ---- Touch: pinch zoom + pan ----
  area.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      lastTouchCenter = getTouchCenter(e.touches);
      lastTouchDistance = getTouchDistance(e.touches);
    }
  }, { passive: false });

  area.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2 || !lastTouchDistance) return;
    e.preventDefault();

    const center = getTouchCenter(e.touches);
    const distance = getTouchDistance(e.touches);
    const rect = area.getBoundingClientRect();

    // Pinch zoom
    const factor = distance / lastTouchDistance;
    const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    const anchorX = center.x - rect.left;
    const anchorY = center.y - rect.top;
    panX = anchorX - (anchorX - panX) * (newZoom / zoom);
    panY = anchorY - (anchorY - panY) * (newZoom / zoom);
    zoom = newZoom;

    // Pan
    if (lastTouchCenter) {
      panX += center.x - lastTouchCenter.x;
      panY += center.y - lastTouchCenter.y;
    }

    lastTouchCenter = center;
    lastTouchDistance = distance;
    applyTransform();
  }, { passive: false });

  area.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      lastTouchCenter = null;
      lastTouchDistance = null;
    }
  });

  function getTouchCenter(touches) {
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2,
    };
  }
  function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  // ---- Keyboard ----
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      navigateBack();
    } else if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      setTheme(theme === 'dark' ? 'light' : 'dark', { save: true });
    }
  });
})();
</script>
</body>
</html>
